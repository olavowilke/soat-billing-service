spring:
  application:
    name: billing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/billing

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
  metrics:
    tags:
      application: billing-service

billing:
  outbox:
    intervalo: ${BILLING_OUTBOX_INTERVALO:PT1S}
  filas:
    comandos: ${BILLING_FILAS_COMANDOS:oficina-homolog-billing-commands}
    comandos-dlq: ${BILLING_FILAS_COMANDOS_DLQ:oficina-homolog-billing-commands-dlq}
    respostas: ${BILLING_FILAS_RESPOSTAS:oficina-homolog-os-saga-replies}
  mercadopago:
    # fake (default) or real. Sandbox only.
    modo: ${BILLING_MERCADOPAGO_MODO:fake}
    access-token: ${BILLING_MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${BILLING_MERCADOPAGO_WEBHOOK_SECRET:}
    base-url: ${BILLING_MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    # true: payment link is the sandbox_init_point. Keep true (sandbox only).
    sandbox: ${BILLING_MERCADOPAGO_SANDBOX:true}
    connect-timeout: ${BILLING_MERCADOPAGO_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${BILLING_MERCADOPAGO_READ_TIMEOUT:PT10S}
  fake:
    # Only with modo=fake: makes the fake refund fail (tests the retry path).
    falhar-estorno: ${BILLING_FAKE_FALHAR_ESTORNO:false}
  estorno:
    # Must match maxReceiveCount of the commands queue redrive policy.
    max-entregas: ${BILLING_ESTORNO_MAX_ENTREGAS:3}
  url-publica: ${BILLING_URL_PUBLICA:http://localhost:8080}
  pagamento:
    prazo: ${BILLING_PAGAMENTO_PRAZO:PT30M}
    # How often the job looks for expired payments.
    verificacao: ${BILLING_PAGAMENTO_VERIFICACAO:PT30S}

logging:
  level:
    br.com.oficina: INFO
    org.hibernate.SQL: WARN

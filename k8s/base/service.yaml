apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina
spec:
  # NodePort fixo: e o alvo do Target Group do NLB (terraform/, var.node_port).
  type: NodePort
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: oficina
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/scheme: "http"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/billing/actuator/prometheus"
    spec:
      serviceAccountName: billing-service
      containers:
        - name: billing-service
          # Placeholder: o CD troca a imagem com `kustomize edit set image` (sha-<sha>).
          image: billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: billing-service-config
            # Criado pelo CD: guarda BILLING_URL_PUBLICA, que vem do SSM.
            - configMapRef:
                name: billing-service-runtime
            # Namespace e Secret existem antes do Deployment (o CD cria os dois).
            - secretRef:
                name: billing-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /api/billing/actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/billing/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/billing/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
